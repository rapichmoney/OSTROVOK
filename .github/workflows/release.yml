name: Build release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Yandex adapter
        run: node tools/verify_yandex_adapter.mjs
      - name: Build portable archive
        shell: pwsh
        run: ./build.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content DesktopIsland.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = "v$version"
          $archive = Get-Item "artifacts/OSTROVOK-$version-win-x64.zip"
          $hash = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($archive.FullName + '.sha256', $hash + '  ' + $archive.Name + "`n")
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "OSTROVOK $version" --notes-file RELEASE_NOTES.md --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag $archive.FullName ($archive.FullName + '.sha256') --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed' }
