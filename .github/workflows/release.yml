name: Build release

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['DesktopIsland.csproj', '.github/workflows/release.yml']

concurrency:
  group: public-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Yandex adapter
        run: node tools/verify_yandex_adapter.mjs
      - name: Build portable archive
        shell: pwsh
        run: ./build.ps1
      - name: Check YouTube controls
        run: node tools/verify_youtube_controls.mjs
      - name: Check packaged application
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'core-report.json'
          $exe = Join-Path $PWD 'artifacts/portable/DesktopIsland.exe'
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test --allow-missing-audio --report `"$reportPath`"" -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Self-test timed out' }
          if (Test-Path -LiteralPath $reportPath) {
            $result = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
            foreach ($check in $result.checks) {
              if (-not $check.pass) {
                $message = ($check.name + ': ' + $check.detail).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error::$message"
              }
            }
          }
          if ($process.ExitCode -ne 0) { throw "Self-test failed with exit code $($process.ExitCode)" }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.failures -ne 0 -or $report.checks.Count -eq 0) { throw 'Invalid self-test report' }
          Write-Output "Passed $($report.checks.Count) application checks"
      - name: Check interface motion
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'motion-verification'
          $exe = Join-Path $PWD 'artifacts/portable/DesktopIsland.exe'
          $process = Start-Process -FilePath $exe -ArgumentList "--verify-motion --output `"$output`"" -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Motion checks timed out' }
          $report = Get-Content -LiteralPath (Join-Path $output 'motion-report.json') -Raw | ConvertFrom-Json
          foreach ($check in $report.checks) {
            if (-not $check.pass) {
              $message = ($check.name + ': ' + $check.detail).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::$message"
            }
          }
          if ($process.ExitCode -ne 0 -or $report.failures -ne 0 -or $report.checks.Count -eq 0) { throw 'Motion checks failed' }
          Write-Output "Passed $($report.checks.Count) interface checks"
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content DesktopIsland.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = "v$version"
          $archive = Get-Item "artifacts/OSTROVOK-$version-win-x64.zip"
          $hash = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($archive.FullName + '.sha256', $hash + '  ' + $archive.Name + "`n")
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'This version already has a release. Bump the version before publishing again.' }
          gh release create $tag $archive.FullName ($archive.FullName + '.sha256') --repo $env:GITHUB_REPOSITORY --title "OSTROVOK $version" --notes-file RELEASE_NOTES.md --target $env:GITHUB_SHA --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
